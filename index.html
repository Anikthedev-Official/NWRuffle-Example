<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NWRuffle Example</title> <!--nochaos-->

  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Ruffle area */
    #flash-content {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Fallback */
    #fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      font-size: 22px;
      pointer-events: none;
    }

    #fallback a {
      color: #ff3333;
      pointer-events: auto;
    }
  </style>


  <script src="bootstrap.js"></script> <!-- for good luck mayybe-->
</head>

<body>



  <div id="flash-content"></div>



  <script>
    function waitForRuffle(cb) {
      if (window.RufflePlayer) cb();
      else requestAnimationFrame(() => waitForRuffle(cb));
    }

    waitForRuffle(() => {
      const container = document.getElementById("flash-content");

      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      Object.assign(player.style, {
        width: "100%",
        height: "100%",
        display: "block"
      });


      container.appendChild(player);


      player.load("file.swf");

      console.log("[NWRuffle] SWF loaded: file.swf");
    });
  </script>

</body>
</html>
